# App name and server port
spring.application.name=emp-app
server.port=8086

# ✅ MongoDB Atlas URI with TLS enabled
spring.data.mongodb.uri=mongodb+srv://empUser:dbempUser%40321@cluster0.noksdy8.mongodb.net/empapp?retryWrites=true&w=majority&tls=true

# ❌ Disable JDBC auto configuration (since you're using MongoDB)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ✅ CORS Settings
spring.web.cors.allowed-origins=http://localhost:3000,http://example.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ✅ Disable session store (if not needed)
spring.session.store-type=none

# ✅ Enable MongoDB debug logs (optional for troubleshooting)
logging.level.org.mongodb.driver=DEBUG
